[project]
name = "financeflow"
version = "0.1.0"
description = "AI-assisted financial document processing and accounts payable automation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires a running PostgreSQL (docker compose up -d)",
]

# Ruff and Pyright share the same Python version and source paths.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "mock_erp", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mock_erp", "tests"]

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "mock_erp", "tests", "alembic"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
