[project]
name = "financeflow"
version = "0.1.0"
description = "AI-assisted financial document processing and accounts payable automation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires a running PostgreSQL (docker compose up -d)",
]
